name: CodeRabbit Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: CodeRabbit Review
        uses: coderabbitai/bring-own-repo@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          coderabbit-token: ${{ secrets.CODERABBIT_TOKEN }}
          max-comments: 50
          languages: >-
            python, typescript, javascript, markdown, yaml
          summarize-changes: true
          auto-apply-fixes: false
