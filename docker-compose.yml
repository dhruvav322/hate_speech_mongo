# ============================================
# Hate Speech Moderation System - Docker Compose
# ============================================
# Main production-ready configuration
# For development, use: docker-compose -f docker-compose.dev.yml up
# For scalable production, use: docker-compose -f docker-compose.scalable.yml up

version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: hate_speech_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: hate_speech_mitigation
    networks:
      - hate_speech_network

  redis:
    image: redis:7-alpine
    container_name: hate_speech_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hate_speech_network
    command: redis-server --appendonly yes

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hate_speech_api
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=hate_speech_mitigation
      - REDIS_URL=redis://redis:6379/0
      - API_HOST=0.0.0.0
      - API_PORT=8001
      - ENVIRONMENT=production
      - API_KEY=${API_KEY:-your-secure-api-key-here}
      - ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      - mongodb
      - redis
    networks:
      - hate_speech_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongodb_data:
  redis_data:

networks:
  hate_speech_network:
    driver: bridge
