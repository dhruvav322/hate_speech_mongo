version: '3.8'

services:
  app:
    build:
      target: development
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=DEBUG
      - RELOAD=true
    depends_on:
      - mongo
      - redis
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    restart: unless-stopped
    networks:
      - hate-speech-network

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    environment:
      - MONGO_INITDB_DATABASE=hate_speech_mitigation
    restart: unless-stopped
    networks:
      - hate-speech-network

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    restart: unless-stopped
    networks:
      - hate-speech-network

volumes:
  mongo_dev_data:
  redis_dev_data:

networks:
  hate-speech-network:
    driver: bridge