# ============================================
# Development Docker Compose Configuration
# ============================================
# Use this for local development with hot reload

version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: hate_speech_mongodb_dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_dev_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: hate_speech_mitigation
    networks:
      - hate_speech_dev_network

  redis:
    image: redis:7-alpine
    container_name: hate_speech_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - hate_speech_dev_network

volumes:
  mongodb_dev_data:
  redis_dev_data:

networks:
  hate_speech_dev_network:
    driver: bridge
