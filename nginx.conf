upstream api_backend {
    least_conn;  # Load balancing method: least connections
    server api1:8001 max_fails=3 fail_timeout=30s;
    server api2:8001 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Client body size limit
    client_max_body_size 1M;

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Health check endpoint (bypass load balancing)
    location /health {
        proxy_pass http://api1:8001/health;
        access_log off;
    }

    # API endpoints
    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Caching headers
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;
    }
}

